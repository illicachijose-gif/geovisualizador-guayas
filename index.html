const map=L.map('map',{zoomControl:true}).setView([-2.16,-79.90],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);

const colors={A:'#1976d2',B:'#2e7d32',C:'#ef6c00',PUESTO:'#c62828'};
const layers=[];

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

data.forEach((d,i)=>{
 const m=L.circleMarker([d.lat,d.lon],{
   radius:6,color:'#fff',weight:1.5,
   fillColor:colors[d.t]||'#555',fillOpacity:.9
 }).bindPopup(
   '<b>'+esc(d.n)+'</b><br>'+
   'Tipo: '+(d.t==='PUESTO'?'Puesto de Salud':'Centro de Salud Tipo '+d.t)+'<br>'+
   'Oficina Técnica: '+esc(d.ot)+'<br>'+
   'Cantón: '+esc(d.c)+'<br>'+
   'Parroquia: '+esc(d.p)+'<br>'+
   'Unicódigo: '+esc(d.u)
 );
 m.d=d; layers.push(m);
});

const ot=document.getElementById('ot');
[...new Set(data.map(d=>d.ot))].sort().forEach(x=>{
 const o=document.createElement('option');o.value=x;o.textContent=x;ot.appendChild(o);
});

function render(){
 const selected=ot.value;
 const q=document.getElementById('buscar').value.toLowerCase().trim();
 let shown=0;
 layers.forEach(m=>{
   const d=m.d;
   const ok=(selected==='TODAS'||d.ot===selected)&&(!q||d.n.toLowerCase().includes(q));
   if(ok){if(!map.hasLayer(m))m.addTo(map);shown++;}
   else if(map.hasLayer(m))map.removeLayer(m);
 });
 document.getElementById('count').textContent=shown+' establecimientos mostrados';
}
ot.addEventListener('change',render);
document.getElementById('buscar').addEventListener('input',render);
render();
</script>
